<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
<title>Chambre de Métiers de Dabou</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--or:#FF8000;--ve:#009A44;--or2:#e07000;--ve2:#007a35;--bg:#FFF8F0;--txt:#3d1f00;--gris:#888}

/* MODIFICATION : On débloque le body pour permettre le scroll réel */
body{
    font-family:system-ui,sans-serif;
    background:var(--bg);
    color:var(--txt);
    overscroll-behavior-y:contain; /* Empêche le refresh au scroll haut */
    overflow-x:hidden;
    overflow-y:auto; 
}

/* On s'assure que le wrapper ne bloque pas le défilement */
#app-wrap{
    display:flex;
    flex-direction:column;
    min-height:100vh;
}

/* SPLASH */
#splash{position:fixed;inset:0;z-index:9999;background:#000;overflow:hidden;transition:opacity .8s,visibility .8s}
#splash.hidden{opacity:0;visibility:hidden;pointer-events:none}
#sp-slides{position:absolute;inset:0}
.sp-slide{position:absolute;inset:0;opacity:0;transition:opacity .9s}
.sp-slide.on{opacity:1}
.sp-slide img{width:100%;height:100%;object-fit:cover}
.sp-slide::after{content:'';position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,.6) 0%,rgba(0,0,0,.05) 40%,rgba(0,0,0,.8) 100%)}
#sp-top{position:absolute;top:0;left:0;right:0;z-index:2;padding:14px 16px 18px;text-align:center}
#sp-top::before{content:'';position:absolute;top:0;left:0;right:0;height:5px;background:linear-gradient(to right,var(--or) 33%,#fff 33% 66%,var(--ve) 66%)}
.sp-icon{font-size:2.2rem;display:block;margin-top:10px}
.sp-title{color:#fff;font-size:1.2rem;font-weight:800;text-shadow:0 2px 8px rgba(0,0,0,.7)}
.sp-sub{color:var(--or);font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
#sp-bot{position:absolute;bottom:0;left:0;right:0;z-index:2;padding:14px 20px 28px;text-align:center}
.sp-dots{display:flex;gap:8px;justify-content:center;margin-bottom:12px}
.sp-dots span{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.3);transition:background .3s,transform .3s}
.sp-dots span.on{background:var(--or);transform:scale(1.5)}
.sp-bar{width:200px;height:3px;background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden;margin:0 auto}
.sp-fill{height:100%;width:0;background:linear-gradient(to right,var(--or),#fff,var(--ve));transition:width .05s linear}

/* LOGIN */
#login-screen{display:none;position:fixed;inset:0;z-index:8000;background:linear-gradient(135deg,var(--or),var(--or2) 45%,var(--ve));align-items:center;justify-content:center;padding:20px;overflow-y:auto}
#login-screen.show{display:flex}
.login-box{background:#fff;border-radius:20px;padding:28px 22px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.3)}

/* APP & NAVIGATION */
#app{display:none;flex-direction:column;min-height:100vh}
#app.visible{display:flex}
.nav-tabs{position:sticky;top:0;z-index:100;display:flex;background:linear-gradient(to right,var(--or),var(--or2) 45%,var(--ve));box-shadow:0 2px 10px rgba(0,0,0,.2)}
.nav-tab{flex:1;padding:13px 5px;text-align:center;color:rgba(255,255,255,.7);font-size:.6rem;font-weight:700;cursor:pointer;background:none;border:none;border-bottom:3px solid transparent}
.nav-tab.active{color:#fff;border-bottom-color:#fff}

/* BOUTON RETOUR EN HAUT (STYLE) */
#btnTop {
    display: none;
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 1000;
    background: var(--ve);
    color: white;
    border: none;
    width: 50px;
    height: 50px;
    border-radius: 50%;
    font-size: 24px;
    font-weight: bold;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    cursor: pointer;
}

/* SECTION ARTISANS & TABLE */
.app-content { padding: 10px; flex: 1; }
.table-wrap { overflow-x: auto; background: #fff; border-radius: 12px; }
table { width: 100%; border-collapse: collapse; }
th { background: var(--or); color: white; padding: 10px; text-align: left; }
td { padding: 10px; border-bottom: 1px solid #eee; }

/* ... (Je garde tes autres styles ici pour ne rien enlever) ... */
</style>
</head>
<body>

<div id="app-wrap">
    <div id="splash">
        <div id="sp-top">
            <span class="sp-icon">🏛️</span>
            <div class="sp-title">CHAMBRE DE MÉTIERS</div>
            <div class="sp-sub">Délégation de Dabou</div>
        </div>
        <div id="sp-slides">
             </div>
        <div id="sp-bot">
            <div class="sp-dots" id="sp-dots"></div>
            <div class="sp-bar"><div class="sp-fill" id="sp-fill"></div></div>
        </div>
    </div>

    <div id="app">
        <nav class="nav-tabs">
            <button class="nav-tab active" onclick="showSec('dashboard')">Stats</button>
            <button class="nav-tab" onclick="showSec('artisans')">Artisans</button>
            <button class="nav-tab" onclick="showSec('vitrine')">Vitrine</button>
        </nav>

        <div class="app-content">
            <div id="sec-artisans" class="section">
                </div>
        </div>
    </div>
</div>

<button id="btnTop" onclick="remonter()">↑</button>

</body>
</html>
