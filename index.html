<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
  <meta name="description" content="Annuaire officiel de la Chambre de Métiers de Dabou - Côte d'Ivoire"/>
  <meta name="theme-color" content="#FF8000"/>
  <title>Chambre de Métiers de Dabou</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<div id="sync-indicator"></div>

<script>
// ============================================
// CONFIGURATION & CONSTANTS
// ============================================
const CONFIG = {
  API_URL: 'https://narfbjdmbvlpxdbzwwkb.supabase.co',
  API_KEY: 'sb_publishable_3ZPgNLcgXVqKun7DPetHew_zZs2iM3m',
  DEFAULT_ADMIN_EMAIL: 'admin@dabou.ci',
  SYNC_INTERVAL: 5000,
  TOAST_DURATION: 3000
};

const VALIDATORS = {
  email: (v) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v),
  phone: (v) => /^[\d\s+()-]+$/.test(v) && v.length >= 8,
  code: (v) => /^\d{4}$/.test(v),
  name: (v) => v.length >= 2 && v.length <= 100,
  password: (v) => v.length >= 6
};

// ============================================
// STATE MANAGEMENT (Centralisé)
// ============================================
class AppState {
  constructor() {
    this.state = {
      user: null,
      artisans: [],
      posts: [],
      messages: [],
      pending: [],
      adminPassword: 'admin123'
    };
    this.listeners = [];
    this.load();
  }

  load() {
    try {
      const saved = localStorage.getItem('app-state');
      if (saved) {
        this.state = { ...this.state, ...JSON.parse(saved) };
      }
    } catch (e) {
      console.error('Erreur chargement state:', e);
    }
  }

  save() {
    try {
      localStorage.setItem('app-state', JSON.stringify(this.state));
    } catch (e) {
      console.error('Erreur sauvegarde state:', e);
    }
  }

  setState(updates) {
    this.state = { ...this.state, ...updates };
    this.save();
    this.notify();
  }

  subscribe(listener) {
    this.listeners.push(listener);
    return () => {
      this.listeners = this.listeners.filter(l => l !== listener);
    };
  }

  notify() {
    this.listeners.forEach(listener => listener(this.state));
  }
}

const appState = new AppState();

// ============================================
// API SERVICE (Sécurisé)
// ============================================
class ApiService {
  static async fetch(path, method = 'GET', body = null) {
    try {
      const options = {
        method,
        headers: {
          'Content-Type': 'application/json',
          'apikey': CONFIG.API_KEY,
          'Authorization': `Bearer ${CONFIG.API_KEY}`
        }
      };

      if (body) options.body = JSON.stringify(body);

      const response = await fetch(CONFIG.API_URL + path, options);
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return await response.json();
    } catch (error) {
      console.error('Erreur API:', error);
      showToast('Erreur réseau', '#dc2626');
      return null;
    }
  }

  static async getMessages() {
    return this.fetch('/rest/v1/messages?order=id.asc');
  }

  static async sendMessage(data) {
    return this.fetch('/rest/v1/messages', 'POST', data);
  }
}

// ============================================
// UTILITIES
// ============================================
function showToast(message, color = '#009A44') {
  const toast = document.getElementById('toast');
  toast.textContent = message;
  toast.style.background = color;
  toast.classList.add('show');
  
  setTimeout(() => {
    toast.classList.remove('show');
  }, CONFIG.TOAST_DURATION);
}

function showSync(active) {
  const indicator = document.getElementById('sync-indicator');
  indicator.style.display = active ? 'block' : 'none';
  if (active) {
    indicator.classList.add('syncing');
  } else {
    indicator.classList.remove('syncing');
  }
}

// Validation des formulaires
function validateFormData(data, rules) {
  const errors = {};
  Object.entries(rules).forEach(([field, rule]) => {
    if (rule.required && !data[field]) {
      errors[field] = `${rule.label} est obligatoire`;
    } else if (data[field] && rule.validator && !rule.validator(data[field])) {
      errors[field] = rule.message || `${rule.label} invalide`;
    }
  });
  return { isValid: Object.keys(errors).length === 0, errors };
}

// Export CSV
function exportToCSV(data, filename = 'export.csv') {
  const csv = [
    Object.keys(data[0]).join(','),
    ...data.map(row => Object.values(row).join(','))
  ].join('\n');

  const blob = new Blob([csv], { type: 'text/csv' });
  const url = window.URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  a.click();
  window.URL.revokeObjectURL(url);
}

// ============================================
// AUTH SERVICE
// ============================================
class AuthService {
  static login(email, password) {
    const { adminPassword } = appState.state;
    
    if (email === CONFIG.DEFAULT_ADMIN_EMAIL && password === adminPassword) {
      const user = { type: 'admin', name: 'Administrateur', email };
      appState.setState({ user });
      return true;
    }
    return false;
  }

  static loginArtisan(phone, code) {
    const phone_ = phone.replace(/\s/g, '');
    const artisan = appState.state.artisans.find(a => 
      a.tel?.replace(/\s/g, '') === phone_ && String(a.code) === String(code)
    );

    if (artisan) {
      const user = { type: 'artisan', name: artisan.name, id: artisan.id, phone };
      appState.setState({ user });
      return true;
    }
    return false;
  }

  static register(data) {
    const { artisans, pending } = appState.state;
    const phone_ = data.phone.replace(/\s/g, '');

    if (artisans.some(a => a.tel?.replace(/\s/g, '') === phone_)) {
      return { success: false, error: 'Ce numéro est déjà enregistré' };
    }

    const registration = {
      id: Date.now(),
      ...data,
      date: new Date().toLocaleDateString('fr-FR')
    };

    appState.setState({ 
      pending: [...pending, registration] 
    });

    return { success: true };
  }

  static logout() {
    appState.setState({ user: null });
  }

  static changePassword(oldPass, newPass) {
    const { adminPassword } = appState.state;
    
    if (oldPass !== adminPassword) {
      return { success: false, error: 'Mot de passe actuel incorrect' };
    }

    if (!VALIDATORS.password(newPass)) {
      return { success: false, error: 'Le nouveau mot de passe doit avoir au moins 6 caractères' };
    }

    appState.setState({ adminPassword: newPass });
    return { success: true };
  }
}

// ============================================
// APP MANAGER
// ============================================
class AppManager {
  constructor() {
    this.syncInterval = null;
    this.init();
  }

  init() {
    appState.subscribe(state => this.render(state));
    this.render(appState.state);
  }

  render(state) {
    const app = document.getElementById('app');
    
    if (!state.user) {
      app.innerHTML = this.renderLoginPage();
      this.attachLoginListeners();
    } else {
      app.innerHTML = this.renderAppPage(state);
      this.attachAppListeners(state);
      this.startSync();
    }
  }

  renderLoginPage() {
    return `
      <div class="login-container">
        <div class="login-box">
          <div class="login-header">
            <div class="logo">⚒️</div>
            <h1>Chambre de Métiers de Dabou</h1>
            <p>Annuaire Officiel</p>
          </div>

          <div class="tabs">
            <button class="tab active" data-tab="admin">👑 Admin</button>
            <button class="tab" data-tab="artisan">🔨 Artisan</button>
            <button class="tab" data-tab="register">📝 S'inscrire</button>
          </div>

          <!-- Admin Form -->
          <form class="form-section active" id="admin-form">
            <div class="form-group">
              <label>Email</label>
              <input type="email" id="admin-email" placeholder="admin@dabou.ci" required/>
            </div>
            <div class="form-group">
              <label>Mot de passe</label>
              <input type="password" id="admin-password" placeholder="••••••••" required/>
            </div>
            <button type="button" class="btn btn-primary full">🔐 Connexion Admin</button>
            <div class="error-message" id="admin-error"></div>
          </form>

          <!-- Artisan Form -->
          <form class="form-section" id="artisan-form" style="display:none">
            <div class="form-group">
              <label>Téléphone</label>
              <input type="tel" id="artisan-phone" placeholder="07 XX XX XX XX" required/>
            </div>
            <div class="form-group">
              <label>Code (4 chiffres)</label>
              <input type="password" id="artisan-code" placeholder="••••" maxlength="4" required/>
            </div>
            <button type="button" class="btn btn-primary full">🔨 Connexion Artisan</button>
            <div class="error-message" id="artisan-error"></div>
          </form>

          <!-- Register Form -->
          <form class="form-section" id="register-form" style="display:none">
            <div class="form-group">
              <label>Nom et Prénom</label>
              <input type="text" id="reg-name" placeholder="Ex: Kouassi Jean" required/>
            </div>
            <div class="form-group">
              <label>Téléphone</label>
              <input type="tel" id="reg-phone" placeholder="07 XX XX XX XX" required/>
            </div>
            <div class="form-group">
              <label>Métier</label>
              <input type="text" id="reg-trade" placeholder="Ex: Menuisier" required/>
            </div>
            <div class="form-group">
              <label>Adresse (optionnel)</label>
              <input type="text" id="reg-address" placeholder="Quartier, Dabou"/>
            </div>
            <div class="form-group">
              <label>Code (4 chiffres)</label>
              <input type="password" id="reg-code" placeholder="••••" maxlength="4" required/>
            </div>
            <button type="button" class="btn btn-primary full">📝 S'inscrire</button>
            <p class="hint">Votre inscription sera validée par l'admin</p>
            <div class="error-message" id="register-error"></div>
          </form>
        </div>
      </div>
    `;
  }

  renderAppPage(state) {
    const { user } = state;
    return `
      <div class="app-container">
        <nav class="navbar">
          <button class="nav-btn active" data-section="dashboard">📊 Tableau de bord</button>
          <button class="nav-btn" data-section="artisans">📋 Annuaire</button>
          <button class="nav-btn" data-section="vitrine">🛍️ Vitrine</button>
          <button class="nav-btn" data-section="messages">💬 Messages</button>
          <button class="nav-btn" data-section="settings">⚙️ Réglages</button>
        </nav>

        <div class="app-content">
          <div class="section active" id="dashboard-section">
            ${this.renderDashboard(state)}
          </div>
          <div class="section" id="artisans-section">
            ${this.renderArtisans(state)}
          </div>
          <div class="section" id="vitrine-section">
            ${this.renderVitrine(state)}
          </div>
          <div class="section" id="messages-section">
            ${this.renderMessages(state)}
          </div>
          <div class="section" id="settings-section">
            ${this.renderSettings(state)}
          </div>
        </div>

        <div class="user-badge">
          👤 ${user.name} · ${user.type === 'admin' ? 'Administrateur' : 'Artisan'}
        </div>
      </div>
    `;
  }

  renderDashboard(state) {
    const { artisans } = state;
    const active = artisans.filter(a => a.status === 'Actif').length;
    const trades = new Set(artisans.map(a => a.trade)).size;
    const apprentices = artisans.reduce((sum, a) => sum + (a.apprentices || 0), 0);

    return `
      <div class="dashboard">
        <h1>Tableau de bord</h1>
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-value">${artisans.length}</div>
            <div class="stat-label">Artisans</div>
          </div>
          <div class="stat-card">
            <div class="stat-value">${trades}</div>
            <div class="stat-label">Métiers</div>
          </div>
          <div class="stat-card">
            <div class="stat-value">${active}</div>
            <div class="stat-label">Actifs</div>
          </div>
          <div class="stat-card">
            <div class="stat-value">${apprentices}</div>
            <div class="stat-label">Apprentis</div>
          </div>
        </div>
      </div>
    `;
  }

  renderArtisans(state) {
    const { artisans, user } = state;
    return `
      <div class="section-content">
        <div class="section-header">
          <h1>📋 Annuaire des Artisans</h1>
          ${user.type === 'admin' ? '<button class="btn btn-success" id="add-artisan-btn">➕ Ajouter</button>' : ''}
        </div>
        <div class="artisans-grid">
          ${artisans.length ? artisans.map(a => `
            <div class="artisan-card">
              <div class="card-header">
                <img src="${a.photo || 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2246%22 height=%2246%22%3E%3Crect fill=%22%23fff3e0%22 width=%2246%22 height=%2246%22/%3E%3C/svg%3E'}" alt="${a.name}" class="artisan-photo"/>
                <div class="card-info">
                  <h3>${a.name}</h3>
                  <p class="trade">${a.trade}</p>
                </div>
              </div>
              <div class="card-details">
                <p><strong>Téléphone:</strong> ${a.tel}</p>
                <p><strong>Adresse:</strong> ${a.address || 'N/A'}</p>
                <p><strong>Statut:</strong> <span class="badge ${a.status === 'Actif' ? 'active' : 'inactive'}">${a.status}</span></p>
              </div>
            </div>
          `).join('') : '<p class="empty">Aucun artisan</p>'}
        </div>
      </div>
    `;
  }

  renderVitrine(state) {
    const { posts } = state;
    return `
      <div class="section-content">
        <h1>🛍️ Vitrine des Artisans</h1>
        <button class="btn btn-success">✏️ Publier</button>
        <div class="posts-grid">
          ${posts.length ? posts.map(p => `
            <div class="post-card">
              <img src="${p.image}" alt="${p.title}" class="post-image"/>
              <div class="post-content">
                <h3>${p.title}</h3>
                <p>${p.description}</p>
                <p class="price">${p.price}</p>
              </div>
            </div>
          `).join('') : '<p class="empty">Aucune publication</p>'}
        </div>
      </div>
    `;
  }

  renderMessages(state) {
    return `
      <div class="section-content">
        <h1>💬 Messagerie</h1>
        <p class="info">Système de messagerie en construction...</p>
      </div>
    `;
  }

  renderSettings(state) {
    const { user } = state;
    return `
      <div class="section-content">
        <h1>⚙️ Réglages</h1>
        <div class="settings-form">
          ${user.type === 'admin' ? `
            <div class="form-section">
              <h2>🔐 Changer le mot de passe admin</h2>
              <div class="form-group">
                <label>Mot de passe actuel</label>
                <input type="password" id="pwd-old" placeholder="••••••••"/>
              </div>
              <div class="form-group">
                <label>Nouveau mot de passe</label>
                <input type="password" id="pwd-new" placeholder="••••••••"/>
              </div>
              <div class="form-group">
                <label>Confirmer</label>
                <input type="password" id="pwd-confirm" placeholder="••••••••"/>
              </div>
              <button class="btn btn-primary" id="change-pwd-btn">💾 Changer</button>
            </div>
          ` : ''}
          <div class="form-section">
            <h2>👤 Informations du compte</h2>
            <p><strong>Nom:</strong> ${user.name}</p>
            <p><strong>Type:</strong> ${user.type === 'admin' ? 'Administrateur' : 'Artisan'}</p>
          </div>
          <button class="btn btn-danger full" id="logout-btn">🚪 Se déconnecter</button>
        </div>
      </div>
    `;
  }

  attachLoginListeners() {
    // Tab switching
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        const form = tab.dataset.tab;
        document.querySelectorAll('.form-section').forEach(f => f.style.display = 'none');
        document.getElementById(`${form}-form`).style.display = 'block';
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
      });
    });

    // Admin login
    document.querySelector('#admin-form button')?.addEventListener('click', () => {
      const email = document.getElementById('admin-email').value;
      const password = document.getElementById('admin-password').value;
      const errorEl = document.getElementById('admin-error');

      if (!AuthService.login(email, password)) {
        errorEl.textContent = 'Email ou mot de passe incorrect';
        showToast('Connexion échouée', '#dc2626');
      } else {
        showToast('Connexion réussie!');
      }
    });

    // Artisan login
    document.querySelector('#artisan-form button')?.addEventListener('click', () => {
      const phone = document.getElementById('artisan-phone').value;
      const code = document.getElementById('artisan-code').value;
      const errorEl = document.getElementById('artisan-error');

      if (!AuthService.loginArtisan(phone, code)) {
        errorEl.textContent = 'Téléphone ou code incorrect';
        showToast('Connexion échouée', '#dc2626');
      } else {
        showToast('Connexion réussie!');
      }
    });

    // Register
    document.querySelector('#register-form button')?.addEventListener('click', () => {
      const data = {
        name: document.getElementById('reg-name').value,
        phone: document.getElementById('reg-phone').value,
        trade: document.getElementById('reg-trade').value,
        address: document.getElementById('reg-address').value,
        code: document.getElementById('reg-code').value
      };

      const validation = validateFormData(data, {
        name: { required: true, label: 'Nom', validator: VALIDATORS.name },
        phone: { required: true, label: 'Téléphone', validator: VALIDATORS.phone },
        trade: { required: true, label: 'Métier' },
        code: { required: true, label: 'Code', validator: VALIDATORS.code }
      });

      if (!validation.isValid) {
        document.getElementById('register-error').textContent = Object.values(validation.errors)[0];
        return;
      }

      const result = AuthService.register(data);
      if (result.success) {
        showToast('✅ Inscription envoyée! En attente de validation.');
        document.getElementById('register-form').reset();
      } else {
        document.getElementById('register-error').textContent = result.error;
      }
    });
  }

  attachAppListeners(state) {
    // Navigation
    document.querySelectorAll('.nav-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const section = btn.dataset.section;
        document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(`${section}-section`).classList.add('active');
        btn.classList.add('active');
      });
    });

    // Logout
    document.getElementById('logout-btn')?.addEventListener('click', () => {
      if (confirm('Se déconnecter ?')) {
        AuthService.logout();
      }
    });

    // Change password
    document.getElementById('change-pwd-btn')?.addEventListener('click', () => {
      const old = document.getElementById('pwd-old').value;
      const nw = document.getElementById('pwd-new').value;
      const confirm = document.getElementById('pwd-confirm').value;

      if (nw !== confirm) {
        showToast('Les mots de passe ne correspondent pas', '#dc2626');
        return;
      }

      const result = AuthService.changePassword(old, nw);
      if (result.success) {
        showToast('✅ Mot de passe changé!');
        document.getElementById('pwd-old').value = '';
        document.getElementById('pwd-new').value = '';
        document.getElementById('pwd-confirm').value = '';
      } else {
        showToast(result.error, '#dc2626');
      }
    });
  }

  startSync() {
    if (this.syncInterval) clearInterval(this.syncInterval);
    
    this.syncInterval = setInterval(async () => {
      showSync(true);
      const messages = await ApiService.getMessages();
      if (messages) {
        appState.setState({ messages });
      }
      showSync(false);
    }, CONFIG.SYNC_INTERVAL);
  }

  stopSync() {
    if (this.syncInterval) clearInterval(this.syncInterval);
  }
}

// ============================================
// INITIALIZATION
// ============================================
const app = new AppManager();

// Error handling
window.addEventListener('error', (event) => {
  console.error('Erreur:', event.error);
  showToast('Une erreur est survenue', '#dc2626');
});

window.addEventListener('unhandledrejection', (event) => {
  console.error('Promise rejetée:', event.reason);
  showToast('Erreur réseau', '#dc2626');
});
</script>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

:root {
  --primary: #FF8000;
  --secondary: #009A44;
  --primary-dark: #e07000;
  --secondary-dark: #007a35;
  --bg: #FFF8F0;
  --text: #3d1f00;
  --gray: #888;
  --error: #dc2626;
  --success: #009A44;
  --border-radius: 12px;
}

html, body {
  font-family: system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100%;
  overflow: hidden;
}

/* LOGIN PAGE */
.login-container {
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100vh;
  background: linear-gradient(135deg, var(--primary), var(--secondary));
  padding: 20px;
}

.login-box {
  background: white;
  border-radius: 20px;
  padding: 40px 30px;
  width: 100%;
  max-width: 420px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
}

.login-header {
  text-align: center;
  margin-bottom: 30px;
}

.logo {
  font-size: 3rem;
  margin-bottom: 15px;
}

.login-header h1 {
  font-size: 1.5rem;
  color: var(--primary);
  margin-bottom: 5px;
}

.login-header p {
  color: var(--gray);
  font-size: 0.9rem;
}

.tabs {
  display: flex;
  gap: 5px;
  margin-bottom: 25px;
  border: 2px solid var(--primary);
  border-radius: 10px;
  overflow: hidden;
}

.tab {
  flex: 1;
  padding: 10px;
  background: white;
  border: none;
  cursor: pointer;
  font-weight: 700;
  font-size: 0.85rem;
  color: var(--primary);
  transition: all 0.2s;
}

.tab.active {
  background: var(--primary);
  color: white;
}

.form-group {
  margin-bottom: 15px;
}

.form-group label {
  display: block;
  font-size: 0.75rem;
  font-weight: 600;
  color: #555;
  margin-bottom: 5px;
}

.form-group input {
  width: 100%;
  padding: 12px;
  border: 1.5px solid #fcd9a0;
  border-radius: 8px;
  font-size: 0.9rem;
  transition: border-color 0.2s;
}

.form-group input:focus {
  outline: none;
  border-color: var(--primary);
